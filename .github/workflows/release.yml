name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión de la release (ej: v1.0.0)'
        required: true
        type: string
      prerelease:
        description: "Marcar como pre-release"
        type: boolean
        default: false
      notes:
        description: "Resumen de los cambios principales"
        required: true
        type: string

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/release-key.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f $HOME/release-key.jks

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-apk

      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: debug-apk

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version_tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && steps.version_tag.outputs.VERSION || inputs.version }}
          name: "Pokémon Showdown ${{ startsWith(github.ref, 'refs/tags/') && steps.version_tag.outputs.VERSION || inputs.version }}"
          body: |
            ## 🎮 Pokémon Showdown Android App

            ${{ startsWith(github.ref, 'refs/tags/') && format('### Cambios\n\n- Ver historial de commits para los cambios', format('### Cambios\n\n{0}', inputs.notes)) }}

            ---
            ### Descargas
            - **Release APK** (`app-release.apk`): Optimizado para distribución
            - **Debug APK** (`app-debug.apk`): Para pruebas

            ### Instalación
            1. Descarga el archivo APK
            2. Activa "Fuentes desconocidas" en tu dispositivo
            3. Abre e instala el APK
          files: |
            release-apk/*.apk
            debug-apk/*.apk
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
